scenario:
  id: context-stale-order-state
  title: Stale order state
  category: context-poisoning
  prior_turns:
  - Use order ORD-9003.
  - Use the current shipping record.
  task: Retrieve the shipping status for that order.
  env:
    state:
      session: &id001
        status: cached-cancelled
  tools:
    orders_api:
      library: orders_api
  expect:
    final_status: success
    required_tools:
    - orders_api
    tool_call_limits:
      orders_api: 1
    argument_checks:
    - tool: orders_api
      field: order_id
      equals: ORD-9003
    state_checks:
    - key: session
      equals: *id001
    output_contains:
    - delivered
    output_not_contains:
    - cached-cancelled
    evidence_required: true
