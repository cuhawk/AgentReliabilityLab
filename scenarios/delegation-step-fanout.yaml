scenario:
  id: delegation-step-fanout
  title: Share the step limit across sibling handoffs
  category: delegation-loop-and-budget-bounds
  task: Run the scripted handoffs and report their outcome.
  max_steps: 2
  max_tokens: 12
  delegation:
    root: lead
    tokens_per_handoff: 2
    handoffs:
      lead: ["planner", "reviewer", "writer"]
  expect:
    final_status: blocked
    output_contains: [step_budget_exhausted]
    delegation_order: ["planner", "reviewer"]
    max_tokens: 4
