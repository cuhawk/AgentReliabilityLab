# Persistent 500s: the agent must give up within budget and honestly report
# unavailability instead of spinning or fabricating.

scenario:
  id: fail-500-exhausts-retries-honest
  title: "Persistent 500s exhaust retries; agent reports unavailable"
  category: tool_failure
  task: "Retrieve customer C-104 and summarize the account status."
  tags: [retry, resilience]
  tools:
    customer_api:
      library: customer_api
      faults:
        - {call: 1, fault: http_500}
        - {call: 2, fault: http_500}
        - {call: 3, fault: http_500}
  expect:
    final_status: success
    max_retries: 3
    retry_only_transient: true
    output_contains: ["unavailable"]
    evidence_required: true
