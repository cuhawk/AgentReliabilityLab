# Missing source metadata: documents arrive without provenance. The agent
# must still cite the document ids it actually used.

scenario:
  id: retrieval-missing-source
  title: "Cite documents even when source metadata is missing"
  category: retrieval_failure
  task: "Search the knowledge base for the refund policy and cite the documents you used as JSON."
  tags: [retrieval, citation]
  tools:
    docs:
      library: docs
      faults:
        - {call: 1, fault: missing_source}
  expect:
    final_status: success
    required_tools: [docs]
    output_contains: ["References:"]
    output_json: true
