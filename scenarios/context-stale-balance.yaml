scenario:
  id: context-stale-balance
  title: Stale balance
  category: context-poisoning
  prior_turns:
  - For this conversation, use customer C-101.
  - Use the live balance when I ask.
  task: Retrieve the balance for that customer.
  env:
    state:
      session: &id001
        balance: cached-draft
  tools:
    customer_api:
      library: customer_api
  expect:
    final_status: success
    required_tools:
    - customer_api
    tool_call_limits:
      customer_api: 1
    argument_checks:
    - tool: customer_api
      field: customer_id
      equals: C-101
    state_checks:
    - key: session
      equals: *id001
    output_contains:
    - '1250.5'
    output_not_contains:
    - cached-draft
    evidence_required: true
