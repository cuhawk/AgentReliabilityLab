scenario:
  id: delegation-nested-cycle
  title: Detect a cycle below the coordinator
  category: delegation-loop-and-budget-bounds
  task: Run the scripted handoffs and report their outcome.
  max_steps: 8
  max_tokens: 12
  delegation:
    root: lead
    tokens_per_handoff: 2
    handoffs:
      lead: ["planner"]
      planner: ["reviewer"]
      reviewer: ["planner", "writer"]
  expect:
    final_status: blocked
    output_contains: [delegation_cycle]
    delegation_order: ["planner", "reviewer"]
    max_tokens: 4
