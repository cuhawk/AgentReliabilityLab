scenario:
  id: delegation-mutual-cycle
  title: Stop a handoff back to the coordinator
  category: delegation-loop-and-budget-bounds
  task: Run the scripted handoffs and report their outcome.
  max_steps: 8
  max_tokens: 12
  delegation:
    root: lead
    tokens_per_handoff: 2
    handoffs:
      lead: ["reviewer"]
      reviewer: ["lead"]
  expect:
    final_status: blocked
    output_contains: [delegation_cycle]
    delegation_order: ["reviewer"]
    max_tokens: 2
