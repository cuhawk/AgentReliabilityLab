scenario:
  id: context-old-order-selection
  title: Old order selection
  category: context-poisoning
  prior_turns:
  - I previously asked about order ORD-0000.
  - 'Correction: use order ORD-9003.'
  task: Retrieve the order id and status for that order.
  env:
    state:
      session: &id001
        order_id: ORD-0000
  tools:
    orders_api:
      library: orders_api
  expect:
    final_status: success
    required_tools:
    - orders_api
    tool_call_limits:
      orders_api: 1
    argument_checks:
    - tool: orders_api
      field: order_id
      equals: ORD-9003
    state_checks:
    - key: session
      equals: *id001
    output_contains:
    - delivered
    output_not_contains:
    - ORD-0000
    evidence_required: true
