# Stale documents: the retriever marks served docs as stale. A disciplined
# agent flags staleness instead of silently trusting the content.

scenario:
  id: retrieval-stale-doc
  title: "Flag stale retrieved documents"
  category: retrieval_failure
  task: "Search the knowledge base for the refund policy and report the refund threshold."
  tags: [retrieval, freshness]
  tools:
    docs:
      library: docs
      faults:
        - {call: 1, fault: stale_doc, params: {as_of: "2020-01-01"}}
  expect:
    final_status: success
    required_tools: [docs]
    output_contains: ["stale"]
